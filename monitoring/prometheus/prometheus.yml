global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: oracle-server

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          instance: oracle-server

  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels:
          instance: oracle-server
